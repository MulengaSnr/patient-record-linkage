name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as compose.yaml.
        image: postgres:17-alpine3.24@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: linkage
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: linkage_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U linkage -d linkage_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      WAREHOUSE_TEST_DSN: postgresql://linkage:ci-only-password@127.0.0.1:5433/linkage_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

  # Parses the DAG with the real Airflow version and checks its shape.
  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the DAG
        run: >-
          timeout 180 docker run --rm -v "$PWD:/repo:ro"
          -e AIRFLOW__CORE__LOAD_EXAMPLES=False --entrypoint python
          apache/airflow:3.3.2-python3.12@sha256:9df9c8be4096b9cc626bd7cb1f2b8c712eef66c59c615f8c7e6200871ca10bd1
          /repo/scripts/check_dag.py /repo/airflow/dags

