# Central configuration: paths, random seed and parameters live here, not in code.
seed: 42
paths:
  raw: data/raw
  processed: data/processed
  figures: reports/figures

linkage_data:
  # Synthea output lives outside the repo. SYNTHEA_DIR overrides this.
  synthea_dir: ~/synthea
  # Synthea's -r option. Kept here so ages are calculated at the same date.
  reference_date: "2026-11-01"
  truth_dir: data/truth         # gitignored, and never read by the pipeline
  batch_days: 30
  populations:
    pilot: {folder: pilot, seed: 42}
    train: {folder: train, seed: 101}
    tune: {folder: tune, seed: 202}
    test: {folder: test, seed: 303}
  sources:
    hospital:
      prefix: H
      coverage: 0.70
      nhs_present: 0.60
      date_format: "%d/%m/%Y"
      pg_date_format: DD/MM/YYYY
      fields: [nhs_number, first_name, middle_name, surname, date_of_birth, sex, address, city, postcode]
    gp:
      prefix: G
      coverage: 0.85
      nhs_present: 0.95
      date_format: "%Y-%m-%d"
      pg_date_format: YYYY-MM-DD
      fields: [nhs_number, first_name, surname, date_of_birth, sex, address, postcode]
    lab:
      prefix: L
      coverage: 0.50
      nhs_present: 0.30
      date_format: "%Y%m%d"
      pg_date_format: YYYYMMDD
      uppercase_names: true
      fields: [nhs_number, first_name, surname, date_of_birth, sex]
  # Illustrative rates chosen for this project, not estimates of real-world error.
  error_levels:
    low:
      first_name_nickname: 0.01
      first_name_typo: 0.01
      first_name_initial: 0.005
      surname_maiden: 0.05
      surname_typo: 0.01
      names_swapped: 0.002
      dob_day_month_swap: 0.003
      dob_typo: 0.003
      dob_missing: 0.002
      sex_missing: 0.002
      sex_wrong: 0.001
      moved_address: 0.05
      address_typo: 0.01
      address_missing: 0.02
      postcode_typo: 0.01
      postcode_missing: 0.02
      nhs_digit_typo: 0.003
      nhs_wrong_person: 0.0005
      duplicate_within_source: 0.02
    medium:
      first_name_nickname: 0.03
      first_name_typo: 0.03
      first_name_initial: 0.01
      surname_maiden: 0.15
      surname_typo: 0.03
      names_swapped: 0.005
      dob_day_month_swap: 0.01
      dob_typo: 0.01
      dob_missing: 0.01
      sex_missing: 0.01
      sex_wrong: 0.003
      moved_address: 0.12
      address_typo: 0.03
      address_missing: 0.05
      postcode_typo: 0.02
      postcode_missing: 0.05
      nhs_digit_typo: 0.01
      nhs_wrong_person: 0.002
      duplicate_within_source: 0.05
    high:
      first_name_nickname: 0.06
      first_name_typo: 0.08
      first_name_initial: 0.03
      surname_maiden: 0.30
      surname_typo: 0.08
      names_swapped: 0.015
      dob_day_month_swap: 0.025
      dob_typo: 0.03
      dob_missing: 0.03
      sex_missing: 0.03
      sex_wrong: 0.01
      moved_address: 0.25
      address_typo: 0.08
      address_missing: 0.12
      postcode_typo: 0.05
      postcode_missing: 0.12
      nhs_digit_typo: 0.03
      nhs_wrong_person: 0.008
      duplicate_within_source: 0.12

# Thresholds for the data-quality gate. Set to pass the high error level and to
# stop a broken feed. A share is the fraction of a source's records affected.
quality:
  min_records: 1
  missing_share:
    first_name: {warn: 0.01, fail: 0.05}
    surname: {warn: 0.01, fail: 0.05}
    date_of_birth: {warn: 0.05, fail: 0.20}
    sex: {warn: 0.05, fail: 0.20}
    address: {warn: 0.15, fail: 0.40}
    # About a quarter of Synthea's people have no usable postcode.
    postcode: {warn: 0.40, fail: 0.60}
  dob_unparseable_share: {warn: 0.001, fail: 0.02}
  dob_in_future_share: {warn: 0.0001, fail: 0.001}
  nhs_invalid_share: {warn: 0.02, fail: 0.10}

linkage:
  seed: 42
  duckdb_memory_limit: 3GB
  duckdb_threads: 3
  # Pairs below this probability are not kept. Clustering chooses the real threshold.
  min_pair_probability: 0.05
  # Unlinked pairs at or above this probability go to the clerical review queue.
  review_lower_probability: 0.5
  # Chosen on the tune population: the lowest threshold reaching this precision.
  target_precision: 0.995
  threshold_sweep: [0.5, 0.7, 0.8, 0.9, 0.95, 0.99, 0.999, 0.9999]
  prior_rules:
    - [nhs_number]
    - [first_name, surname, date_of_birth]
  prior_recall: 0.7
  u_max_pairs: 1.0e+7
  em_blocking:
    - [date_of_birth]
    - [first_name, surname]
  blocking_rules:
    - [nhs_number]
    - [first_name, surname]
    - [date_of_birth, surname]
    - [date_of_birth, first_name]
    - [postcode, surname]
    - [postcode, date_of_birth]
    - [address]
  baseline_rules:
    - [nhs_number]
    - [first_name, surname, date_of_birth]
